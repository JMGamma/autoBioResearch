# AutoBioResearch configuration
# Override any value via environment variable using the same key uppercased.
# Sensitive keys (API keys) should go in .env instead.

# --- LLM Backend ---
# Use "anthropic" for Claude via Anthropic API (requires ANTHROPIC_API_KEY in .env)
# Use "openai_compatible" for local LLMs (Ollama, LM Studio, vLLM, llama.cpp server, etc.)
llm_api_type: "openai_compatible"
llm_model: "qwen/qwen3.5-9b-claude-4.6-opus-reasoning-distilled-v2"
# For openai_compatible mode, set the base URL of your local LLM REST server:
llm_base_url: "http://127.0.0.1:11435/v1"   # Ollama
# llm_base_url: "http://localhost:1234/v1"    # LM Studio
# llm_api_key is read from LLM_API_KEY in .env — do not put keys here

# --- LLM tuning ---
llm_temperature: 0.1
llm_max_tokens: 10000         # output token cap — raised from 8192; dense full-text papers can hit 8-10k
llm_truncation_retries: 1     # retry once if finish_reason=length; double-truncations go to truncation_review.log
llm_requests_per_minute: 40
llm_max_retries: 3
llm_retry_backoff_seconds: 5
llm_timeout_seconds: 600      # 10 min hard cap; kills runaway generation before Ollama drops the connection

# --- Database ---
db_path: "./autobioresearch.db"

# --- Paper fetching ---
crawler_threads: 4
papers_per_query: 5
max_full_text_per_cycle: 20
pubmed_requests_per_second: 3
semantic_scholar_requests_per_second: 0.3  # unauthenticated limit ~100 req/5min; set to 1.0 once SEMANTIC_SCHOLAR_API_KEY is configured

# --- Extraction ---
max_chunk_chars: 100000
chunk_overlap_chars: 2000
min_snippet_length: 20
max_snippet_length: 400
snippet_fuzzy_threshold: 0.75

# --- Conflict detection ---
max_candidate_pairs_per_cycle: 500

# --- Entity normalization ---
fuzzy_match_threshold: 0.92
min_interactions_per_entity: 3

# --- External entity resolution ---
# UniProt (proteins/genes) and ChEBI (molecules/metabolites) are queried when
# exact synonym and fuzzy matching both fail, enriching the synonym set before
# creating a new entity. Uses independent APIs with no shared NCBI rate-limit budget.
entity_resolution_enabled: true
entity_resolution_requests_per_second: 3.0
entity_resolution_timeout: 10

# --- Perturbation ---
# Exponent alpha in multi-path score combination: 1 - prod(1 - |x_i|^alpha)
# Lower α → paths combine more aggressively. Range (0, 1]. Default 0.55.
perturbation_combination_exponent: 0.55

# --- Scoring ---
# score = (N_entities * N_interactions) / (1 + penalty * weighted_conflict_sum)
# penalty_weight per conflict type: true=1.0, ambiguous=0.5, context_dependent=0.0
penalty: 2.0

# --- Loop control ---
cycle_sleep_seconds: 300
max_cycles: 0   # 0 = run forever

# --- Per-cycle processing caps ---
queries_per_cycle: 10
papers_per_cycle: 50
conflicts_to_analyze_per_cycle: 20

# --- Logging ---
log_level: "INFO"
log_file: "./logs/autobioresearch.log"
truncation_review_log_file: "./logs/truncation_review.log"

# --- Reasoning / thinking capture (openai_compatible only) ---
# Set to true to capture <think>…</think> blocks and/or reasoning_content fields
# from models like Qwen3, DeepSeek-R1, QwQ, etc.
# Output goes to reasoning_log_file, rotated at reasoning_log_max_bytes.
log_reasoning: true
reasoning_log_file: "./logs/reasoning.log"
reasoning_log_max_bytes: 10485760   # 10 MB
reasoning_log_backup_count: 3

# --- Seed queries (bootstrap the system) ---
# All queries include mammalian organism filters to avoid plant/yeast/fish papers.
seed_queries:
  - query: "protein-protein interactions cancer signaling human mouse"
    source_api: pubmed
  - query: "kinase substrate phosphorylation mechanism mammalian"
    source_api: pubmed
  - query: "transcription factor target gene regulation human"
    source_api: pubmed
  - query: "enzyme inhibitor mechanism binding human mouse rat"
    source_api: pubmed
  - query: "GPCR signaling pathway receptor mammalian"
    source_api: pubmed
  - query: "metabolic enzyme substrate product human"
    source_api: pubmed
  - query: "immune checkpoint protein interaction human mouse"
    source_api: pubmed
  - query: "DNA repair protein complex human"
    source_api: pubmed
