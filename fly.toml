app = "autobioresearch"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/stats"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source      = "autobio_data"
  destination = "/data"

[env]
  PORT          = "8000"
  DB_PATH       = "/data/autobioresearch.db"
  CACHE_DB_PATH = "/data/explorer_cache.db"
